# Sandisk Sync settings.
# Put Windows paths in single quotes so the backslashes are kept as-is.

[player]
# The player's name as File Explorer shows it. The program looks for a drive with this label.
label = 'SPORT PLUS'
# Set a drive letter here (for example 'E:') to skip the search by label.
drive = ''

[music]
# Everything under this folder, including all subfolders, is mirrored to the player.
source = 'Y:\Media\Music'
# Folder on the player that holds the copy.
folder = 'Music'
# File types copied to the player. The Clip Sport Plus plays MP3, AAC/M4A, WMA, WAV and FLAC.
extensions = ['.mp3', '.m4a', '.aac', '.wma', '.wav', '.flac']

[podcasts]
# Folder on the player that holds podcasts. Each show gets its own subfolder.
folder = 'Podcasts'
# Episodes this many days old or older are removed from the player (and never downloaded).
max_age_days = 60
# Each sync makes sure this many of each show's newest episodes are on the player.
# Episodes you've already had (even ones you deleted) aren't downloaded again.
episodes_per_show = 5

